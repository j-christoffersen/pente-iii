<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <base href="/game/">
    <title>Pente</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: auto;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
    </style>
    <script>
        // Set canvas CSS size before macroquad reads clientWidth.
        // DISPLAY_TILES = BOARD_SIZE(19) + BORDER*2(4) = 23; tile = 16px * 2x = 32px
        (function() {
            var px = (19 + 4) * 32 + "px";
            var s = document.createElement("style");
            s.textContent = "#glcanvas { width: " + px + "; height: " + px + "; }";
            document.head.appendChild(s);
        })();
    </script>
</head>
<body>
    <canvas id="glcanvas" tabindex="0"></canvas>
    <!-- mq_js_bundle.js ships with macroquad — copy it here via build-wasm.sh -->
    <script src="mq_js_bundle.js"></script>
    <script>load("pente-ui.wasm");</script>
</body>
</html>
